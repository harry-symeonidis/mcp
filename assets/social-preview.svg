<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="mcp: local MCP tools for LM Studio and Ollama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="150" cy="90" r="300" fill="#4f46e5"/>
    <circle cx="560" cy="700" r="320" fill="#0284c7"/>
    <circle cx="1160" cy="110" r="320" fill="#0d9488"/>
    <circle cx="960" cy="660" r="240" fill="#7c3aed"/>
  </g>

  <g transform="translate(980 320) scale(1.5) translate(-960 -160)">
    <g fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round">
      <path d="M960 160 C 1010 110, 1050 96, 1096 92"/>
      <path d="M960 160 C 1020 150, 1060 150, 1118 160"/>
      <path d="M960 160 C 1010 210, 1050 224, 1096 228"/>
      <path d="M960 160 C 920 110, 900 98, 868 94"/>
      <path d="M960 160 C 920 210, 900 222, 868 226"/>
    </g>
    <g fill="#ffffff">
      <circle cx="960" cy="160" r="34" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="960" cy="160" r="12" fill-opacity="0.95"/>
      <circle cx="1096" cy="92" r="9" fill-opacity="0.85"/>
      <circle cx="1118" cy="160" r="9" fill-opacity="0.85"/>
      <circle cx="1096" cy="228" r="9" fill-opacity="0.85"/>
      <circle cx="868" cy="94" r="9" fill-opacity="0.85"/>
      <circle cx="868" cy="226" r="9" fill-opacity="0.85"/>
    </g>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="96" y="330" font-size="168" font-weight="700" letter-spacing="-5">mcp</text>
    <text x="104" y="408" font-size="38" font-weight="500" fill-opacity="0.9">Local MCP tools for</text>
    <text x="104" y="458" font-size="38" font-weight="500" fill-opacity="0.9">LM Studio and Ollama</text>
    <text x="104" y="530" font-size="24" fill-opacity="0.62">documents · git · files · browser · images</text>
  </g>
</svg>
