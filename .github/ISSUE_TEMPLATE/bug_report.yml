name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - comfyui-image-mcp
        - mcp_smoke_test.py
        - Docs / example configs
        - Third-party server setup (markitdown, git, filesystem, playwright)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: e.g. LM Studio 0.4.x, ollmcp 0.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and GPU
      placeholder: e.g. Windows 11, AMD Radeon / NVIDIA / CPU only
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        Output of tools/mcp_smoke_test.py for the server, plus any relevant log lines
        (e.g. COMFYUI_LOG). Remove paths or names you don't want to share.
      render: text
